<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/kamurafox.svg" alt="" width="46" height="46" />
      <h1>Kamurafox</h1>
      <span id="sticker" class="sticker" hidden></span>
    </header>
    <div class="states">
      <p id="bridge" class="status"></p>
      <p id="sessions" class="status"></p>
    </div>

    <section class="card">
      <h2 id="tabs-title"></h2>
      <ul id="tabs"></ul>
    </section>
    <button id="pause" class="btn gold" type="button"></button>
    <p id="paused-note" class="tip" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
